<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="disco" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="60%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1ed760"/>
      <stop offset="100%" stop-color="#1db954"/>
    </linearGradient>
  </defs>
  <!-- Fondo circular del vinilo -->
  <circle cx="256" cy="256" r="240" fill="url(#disco)" stroke="#333333" stroke-width="8"/>
  
  <!-- Ranuras del disco de vinilo -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#222222" stroke-width="4"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#222222" stroke-width="4"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#222222" stroke-width="4"/>
  
  <!-- Centro del disco (Etiqueta Verde) -->
  <circle cx="256" cy="256" r="85" fill="url(#neon)"/>
  <circle cx="256" cy="256" r="24" fill="#121212"/>

  <!-- Nota musical en el centro -->
  <path d="M246 220 v-40 c0 -5 4 -9 9 -9 h20 c5 0 9 4 9 9 v40" fill="none" stroke="#121212" stroke-width="6"/>
  <circle cx="240" cy="225" r="14" fill="#121212"/>
</svg>
